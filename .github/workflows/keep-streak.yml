name: Keep streak

on:
  schedule:
    - cron: "0 1 * * *"   # 22:00 em Brasília (UTC-3)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  streak:
    runs-on: ubuntu-latest
    env:
      TZ: America/Sao_Paulo
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      USERNAME: lucasnunesf
    steps:
      - uses: actions/checkout@v4

      - name: Contar contribuições de hoje (horário de Brasília)
        id: check
        run: |
          FROM=$(date -d "today 00:00" -u +%Y-%m-%dT%H:%M:%SZ)
          TO=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          COUNT=$(gh api graphql -f query='
            query($u:String!,$from:DateTime!,$to:DateTime!){
              user(login:$u){ contributionsCollection(from:$from,to:$to){
                totalCommitContributions totalIssueContributions
                totalPullRequestContributions totalPullRequestReviewContributions
                totalRepositoryContributions } } }' \
            -f u="$USERNAME" -f from="$FROM" -f to="$TO" \
            --jq '.data.user.contributionsCollection | [.[]] | add')
          echo "Contribuições hoje: $COUNT"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Commit se não houve nada hoje
        if: steps.check.outputs.count == '0'
        run: |
          git config user.name "Lucas Fernandes Nunes"
          git config user.email "134228031+lucasnunesf@users.noreply.github.com"
          mkdir -p log
          echo "- $(date +%Y-%m-%d): revisão diária" >> log/daily-log.md
          git add log/daily-log.md
          git commit -m "Daily log $(date +%Y-%m-%d)"
          git push
